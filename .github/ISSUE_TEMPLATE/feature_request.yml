name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: input
    id: environment
    attributes:
      label: Environment (if relevant)
      placeholder: e.g. QGIS 3.34.5, plugin 1.7.2, Windows 11
